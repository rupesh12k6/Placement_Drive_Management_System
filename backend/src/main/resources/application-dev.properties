# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Placement_DB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-db-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://drive-flow-eight.vercel.app}

# HikariCP Performance Tuning
# Increase pool size for concurrent requests
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
# Reduce wait time for a connection
spring.datasource.hikari.connection-timeout=20000
# Optimize connection life
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate Performance Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Batching - Reduces network round-trips for inserts/updates
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Open Session In View - Already disabled in main props, keeping it off for performance
spring.jpa.open-in-view=false

# Caching (Basic L2 Query Cache configuration)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false


# Logging Configuration (Keep for dev, but note it adds slight overhead)
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration



cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:placeholder-cloud-name}
cloudinary.api_key=${CLOUDINARY_API_KEY:placeholder-api-key}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:placeholder-api-secret}

superadmin.email=${SUPERADMIN_EMAIL:superAdmin@anits.edu.in}
superadmin.password=${SUPERADMIN_PASSWORD:change-me-superadmin-password}
superadmin.name=${SUPERADMIN_NAME:ANITS}



app.jwt.secret=${APP_JWT_SECRET:change-me-jwt-secret-with-at-least-32-characters}
app.jwt.access-token-expiration=${APP_JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${APP_JWT_REFRESH_EXPIRATION:604800000}
